name: ACK mainline lkm build

on:
  workflow_dispatch:
    inputs:
      PUBLISH_TYPE:
        description: 'Choose Artifact Publishing Type'
        required: true
        type: choice
        default: 'artifact'
        options:
          - 'release'
          - 'artifact'
          - 'both'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v2.0.0   # 建议固定到具体版本，而非 @main
      with:
          android: true           # 删除 Android SDK (~14GB)
          dotnet: true            # 删除 .NET 运行时 (~2.7GB)
          haskell: true           # 删除 Haskell (在部分镜像上收益很小)
          docker-images: true     # 删除预装的 Docker 镜像

    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Install Dependencies & Setup Repo
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison build-essential libssl-dev libelf-dev \
          git-core gnupg ccache zip curl zlib1g-dev python3 python3-pip libbz2-dev
        
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+rx ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH

    - name: Sync Source Code & Get Commit SHA
      id: sync
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        mkdir workspace
        cd workspace
        
        repo init -u https://android.googlesource.com/kernel/manifest -b common-android-mainline --depth=1
        repo sync -c --no-tags --no-clone-bundle -j$(nproc)
        
        COMMIT_SHA=$(git -C common rev-parse --short=7 HEAD)
        echo "COMMIT_SHA=${COMMIT_SHA}" >> $GITHUB_OUTPUT
        rm -rf .repo

    - name: Build Kernel with Kleaf
      run: |
        cd workspace
        tools/bazel build --config=fast //common:kernel_aarch64

    - name: Build LKM
      id: meta
      run: |
        cd workspace
        git clone https://github.com/aaaaaaaa-815/KernelSU.git -b patch-1
        
        CLANG_VER=$(grep 'CLANG_VERSION' common/bazel/constants.scl | cut -d '"' -f 2)
        CLANG_PATH="$PWD/prebuilts/clang/host/linux-x86/clang-$CLANG_VER/bin"
        ROOTDIR="$PWD"
        KDIR=$(dirname $(find out/cache -type f -name "localversion" | head -n 1))
        FULL_KDIR="$ROOTDIR/$KDIR"
        
        COMMIT_SHA="${{ steps.sync.outputs.COMMIT_SHA }}"
        COMMIT_COUNT=$(git -C KernelSU rev-list --count HEAD)
        VERSION_TAG="v${COMMIT_COUNT}-${COMMIT_SHA}"
        
        echo "COMMIT_COUNT=${COMMIT_COUNT}" >> $GITHUB_OUTPUT
        echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_OUTPUT
        
        cd KernelSU
        sed -i '/ifeq ($(filter \/%,$(src)),)/,/endif/c\KSU_KERNEL_DIR := $(src)' kernel/Kbuild
        cd "$ROOTDIR"
        KCONFIG_FILE=$(find out/cache -name ".config" | head -n 1)
        VER=$(grep 'CONFIG_PAHOLE_VERSION' "$KCONFIG_FILE" | cut -d '=' -f 2)
        TARGET_PAHOLE_VER="v$(printf "%.2f" $(echo "$VER / 100" | bc -l))"
        echo $TARGET_PAHOLE_VER
        PAHOLE_BIN="$PWD/prebuilts/kernel-build-tools/linux_musl-x86/bin/pahole"

        for f in $(find "$PWD" -name "pahole" -type f 2>/dev/null); do
              if [ -x "$f" ]; then
                  OUT=$("$f" --version 2>&1)
    
                  if [[ "$OUT" == *"$TARGET_PAHOLE_VER"* ]]; then
                      PAHOLE_BIN="$f"
                      break
                  fi
              fi
        done

        make -C "$FULL_KDIR" \
          PATH="$CLANG_PATH:$PATH" \
          ARCH=arm64 \
          SUBARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LLVM=1 \
          LLVM_IAS=1 \
          CC="$CLANG_PATH/clang" \
          LD="$CLANG_PATH/ld.lld" \
          AR="$CLANG_PATH/llvm-ar" \
          NM="$CLANG_PATH/llvm-nm" \
          OBJCOPY="$CLANG_PATH/llvm-objcopy" \
          OBJDUMP="$CLANG_PATH/llvm-objdump" \
          STRIP="$CLANG_PATH/llvm-strip" \
          PAHOLE="$PAHOLE_BIN" \
          M=$PWD/KernelSU/kernel \
          CONFIG_KSU=m \
          CONFIG_KSU_DEBUG=y \
          KBUILD_MODPOST_WARN=1 \
          modules -j$(nproc)

    - name: Upload Actions Artifact (Store Mode)
      if: ${{ github.event.inputs.PUBLISH_TYPE == 'artifact' || github.event.inputs.PUBLISH_TYPE == 'both' }}
      uses: actions/upload-artifact@v7
      with:
        name: kernelsu-${{ steps.meta.outputs.VERSION_TAG }}.ko
        path: workspace/KernelSU/kernel/kernelsu.ko

    - name: Create GitHub Release
      if: ${{ github.event.inputs.PUBLISH_TYPE == 'release' || github.event.inputs.PUBLISH_TYPE == 'both' }}
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.meta.outputs.VERSION_TAG }}
        name: KernelSU Module (${{ steps.meta.outputs.VERSION_TAG }})
        body: |
          - **Kernel Commit**: `${{ steps.sync.outputs.COMMIT_SHA }}`
          - **KernelSU Commit Count**: `${{ steps.meta.outputs.COMMIT_COUNT }}`
        files: workspace/KernelSU/kernel/kernelsu.ko
